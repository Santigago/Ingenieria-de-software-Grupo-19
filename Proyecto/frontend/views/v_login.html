<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KidZania - Acceso Personal de Oficina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-zinc-950 flex items-center justify-center min-h-screen p-4 text-slate-100">

    <div class="w-full max-w-md">
        <!-- Logo & Brand Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-rose-600 to-amber-500 shadow-lg shadow-rose-950/50 mb-3">
                <span class="text-3xl font-extrabold text-white tracking-wider">KZ</span>
            </div>
            <h1 class="text-3xl font-extrabold text-white tracking-tight">KidZania <span class="text-rose-500">Santiago</span></h1>
            <p class="text-slate-400 text-sm mt-1">Portal de Acceso · Personal de Oficina</p>
        </div>

        <!-- Login Card -->
        <div class="bg-slate-900/90 backdrop-blur-xl p-8 rounded-2xl shadow-2xl border border-slate-800">
            <form id="loginForm" class="space-y-5">
                <div>
                    <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Correo Institucional (@kidzania.cl)</label>
                    <div class="relative">
                        <input type="email" id="email" required 
                            class="w-full px-4 py-3 bg-slate-950/80 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-rose-500 focus:border-rose-500 transition text-sm" 
                            placeholder="carlos@kidzania.cl"
                            value="carlos@kidzania.cl">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Contraseña</label>
                    <input type="password" id="password" required 
                        class="w-full px-4 py-3 bg-slate-950/80 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-rose-500 focus:border-rose-500 transition text-sm" 
                        placeholder="••••••••"
                        value="1234">
                </div>

                <div id="statusAlert" class="hidden p-3.5 rounded-xl bg-rose-950/60 border border-rose-600/50 text-rose-200 text-sm text-center"></div>

                <button type="submit" id="btnSubmit"
                    class="w-full py-3.5 px-4 bg-gradient-to-r from-rose-600 to-amber-600 hover:from-rose-500 hover:to-amber-500 text-white font-semibold rounded-xl transition duration-200 shadow-lg shadow-rose-950/40 active:scale-[0.99] flex items-center justify-center gap-2">
                    <span>Ingresar al Sistema</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-slate-800 text-center">
                <p class="text-xs text-slate-400 mb-3">¿Eres Cajero o Personal de Cocina en un puesto de venta?</p>
                <a href="v_pos_login.html" 
                   class="inline-flex items-center justify-center gap-2 w-full py-3 px-4 bg-slate-800/80 hover:bg-slate-800 text-amber-400 hover:text-amber-300 font-semibold text-sm rounded-xl border border-slate-700/80 hover:border-amber-500/50 transition duration-150 shadow-md">
                    <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                    <span>Cambiar a Terminal Táctil POS (Ingreso con PIN)</span>
                </a>
            </div>
        </div>

        <!-- Footer -->
        <p class="text-center text-xs text-slate-500 mt-6">
            KidZania Santiago · Sistema de Gestión Operativa ParkFlow · Grupo 19
        </p>
    </div>

    <script src="../js/app-common.js"></script>
    <script>
        const existingToken = localStorage.getItem('token');
        const existingRoleName = localStorage.getItem('rol_nombre');

        // Si había una sesión previa incompleta (sin rol_nombre válido), limpiarla para no redirigir por error a v_pos.html
        if (existingToken && !existingRoleName) {
            localStorage.removeItem('token');
            localStorage.removeItem('rol');
            localStorage.removeItem('rol_nombre');
            localStorage.removeItem('usuario');
            localStorage.removeItem('permisos');
        }

        const form = document.getElementById('loginForm');
        const statusAlert = document.getElementById('statusAlert');
        const btnSubmit = document.getElementById('btnSubmit');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            btnSubmit.disabled = true;
            btnSubmit.classList.add('opacity-75');

            try {
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario_correo: email, usuario_contrasena: password })
                });

                const data = await response.json();
                if (!response.ok) {
                    statusAlert.textContent = data.message || 'Credenciales incorrectas';
                    statusAlert.classList.remove('hidden');
                    btnSubmit.disabled = false;
                    btnSubmit.classList.remove('opacity-75');
                    return;
                }

                localStorage.setItem('token', data.token);
                localStorage.setItem('rol', String(data.rol));
                localStorage.setItem('rol_nombre', data.rol_nombre || '');
                localStorage.setItem('usuario', data.usuario?.nombres ? `${data.usuario.nombres} ${data.usuario.apellido_paterno || ''}`.trim() : email);
                if (data.permisos) {
                    localStorage.setItem('permisos', JSON.stringify(data.permisos));
                }
                statusAlert.classList.add('hidden');

                // Redirigir a la página de inicio correspondiente al rol autenticado (CU 1 y CU 2)
                window.location.href = data.pagina_inicio || obtenerPaginaInicioRol(data.rol_nombre);
            } catch (error) {
                statusAlert.textContent = 'No se pudo conectar con el servidor';
                statusAlert.classList.remove('hidden');
                btnSubmit.disabled = false;
                btnSubmit.classList.remove('opacity-75');
            }
        });
    </script>
</body>
</html>
